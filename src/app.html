<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Set the theme before first paint to avoid a flash. Keep in sync with theme.ts.
			(function () {
				try {
					var stored = localStorage.getItem('ctp-theme');
					var theme = (stored === 'latte' || stored === 'mocha')
						? stored
						: (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'mocha' : 'latte');
					document.documentElement.dataset.theme = theme;
					document.documentElement.style.background = theme === 'mocha' ? '#1e1e2e' : '#ffffff';
				} catch (e) { /* localStorage unavailable; fall back to CSS default */ }
			})();
		</script>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
